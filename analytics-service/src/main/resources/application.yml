server:
  port: 8084

spring:
  profiles:
    default: local
  application:
    name: analytics-service
  data:
    mongodb:
      uri: mongodb://${MONGODB_USERNAME:${MONGO_USER}}:${MONGODB_PASSWORD:${MONGO_PASSWORD}}@${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/analytics?authSource=admin
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
      ssl.truststore.type: PEM
      ssl.truststore.certificates: ${KAFKA_SSL_TRUSTSTORE_CERTIFICATES:}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}

jwt:
  security:
    excluded-paths:
      - /actuator/health
      - /actuator/health/**
  secret: ${JWT_SECRET}
  access-token-expire-ms: 3600000
  refresh-token-expire-ms: 86400000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
