global:
  smtp_smarthost: ${SMTP_SMARTHOST}
  smtp_from: ${SMTP_FROM}
  smtp_auth_username: ${SMTP_AUTH_USERNAME}
  smtp_auth_password_file: ${SMTP_AUTH_PASSWORD_FILE}

route:
  receiver: webhook
  group_by:
    - alertname
    - service
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: webhook
      continue: true
    - receiver: email

receivers:
  - name: webhook
    webhook_configs:
      - url: ${ALERTMANAGER_WEBHOOK_URL}
        send_resolved: true

  - name: email
    email_configs:
      - to: ${ALERT_EMAIL_TO}
        send_resolved: true
