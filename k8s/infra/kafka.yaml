apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: notification-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "SASL_SSL://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "SASL_SSL://kafka-service:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,SASL_SSL:SASL_SSL"
            - name: KAFKA_SASL_ENABLED_MECHANISMS
              value: "PLAIN"
            - name: KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL
              value: "PLAIN"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "SASL_SSL"
            - name: KAFKA_LISTENER_NAME_SASL_SSL_PLAIN_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: notification-hub-kafka-secret
                  key: KAFKA_SASL_SERVER_JAAS_CONFIG
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: "PKCS12"
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: "PKCS12"
            - name: KAFKA_SSL_KEYSTORE_FILENAME
              value: "kafka.keystore.p12"
            - name: KAFKA_SSL_KEY_CREDENTIALS
              value: "kafka-key-password"
            - name: KAFKA_SSL_KEYSTORE_CREDENTIALS
              value: "kafka-keystore-password"
            - name: KAFKA_SSL_TRUSTSTORE_FILENAME
              value: "kafka.truststore.p12"
            - name: KAFKA_SSL_TRUSTSTORE_CREDENTIALS
              value: "kafka-truststore-password"
            - name: KAFKA_SSL_CLIENT_AUTH
              value: "none"
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: "/etc/kafka/secrets/kafka.truststore.p12"
            - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-hub-kafka-secret
                  key: KAFKA_SSL_TRUSTSTORE_CREDENTIALS
            - name: KAFKA_OPTS
              value: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
          ports:
            - containerPort: 9092
          volumeMounts:
            - name: kafka-secrets
              mountPath: /etc/kafka/secrets
              readOnly: true
      volumes:
        - name: kafka-secrets
          secret:
            secretName: notification-hub-kafka-secret
            items:
              - key: KAFKA_SSL_KEYSTORE_FILE
                path: kafka.keystore.p12
              - key: KAFKA_SSL_TRUSTSTORE_FILE
                path: kafka.truststore.p12
              - key: KAFKA_SSL_KEY_CREDENTIALS
                path: kafka-key-password
              - key: KAFKA_SSL_KEYSTORE_CREDENTIALS
                path: kafka-keystore-password
              - key: KAFKA_SSL_TRUSTSTORE_CREDENTIALS
                path: kafka-truststore-password
              - key: KAFKA_SASL_SERVER_JAAS_CONFIG_FILE
                path: kafka_server_jaas.conf
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: notification-hub
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
