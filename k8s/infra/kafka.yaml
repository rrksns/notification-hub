apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: notification-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "SASL_SSL://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "SASL_SSL://kafka-service:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,SASL_SSL:SASL_SSL"
            - name: KAFKA_SASL_ENABLED_MECHANISMS
              value: "PLAIN"
            - name: KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL
              value: "PLAIN"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "SASL_SSL"
            - name: KAFKA_LISTENER_NAME_SASL_SSL_PLAIN_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: notification-hub-secret
                  key: KAFKA_SASL_SERVER_JAAS_CONFIG
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: "PEM"
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: "PEM"
            - name: KAFKA_SSL_KEYSTORE_CERTIFICATE_CHAIN
              valueFrom:
                secretKeyRef:
                  name: notification-hub-secret
                  key: KAFKA_SSL_KEYSTORE_CERTIFICATE_CHAIN
            - name: KAFKA_SSL_KEYSTORE_KEY
              valueFrom:
                secretKeyRef:
                  name: notification-hub-secret
                  key: KAFKA_SSL_KEYSTORE_KEY
            - name: KAFKA_SSL_TRUSTSTORE_CERTIFICATES
              valueFrom:
                secretKeyRef:
                  name: notification-hub-secret
                  key: KAFKA_SSL_TRUSTSTORE_CERTIFICATES
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
          ports:
            - containerPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: notification-hub
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
